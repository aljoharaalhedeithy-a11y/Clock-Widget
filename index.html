<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Riyadh Clock</title>
  <style>
    :root {
      --bg: transparent;
      --text: #111111;
      --muted: #777777;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
    }

    .clock-wrap {
      width: 100%;
      max-width: 420px;
      padding: 20px 24px;
      text-align: center;
    }

    .time {
      font-size: clamp(42px, 15vw, 86px);
      font-weight: 300;
      letter-spacing: 0.02em;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .seconds {
      color: var(--muted);
      font-weight: 300;
    }

    .label {
      margin-top: 12px;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --text: #f4f4f4;
        --muted: #999999;
      }
    }
  </style>
</head>
<body>
  <main class="clock-wrap" aria-label="Riyadh time clock">
    <div class="time" id="clock">--:--:<span class="seconds">--</span></div>
    <div class="label">Riyadh, Saudi Arabia</div>
  </main>

  <script>
    function updateClock() {
      const now = new Date();
      const parts = new Intl.DateTimeFormat("en-GB", {
        timeZone: "Asia/Riyadh",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      }).formatToParts(now);

      const get = (type) => parts.find((part) => part.type === type).value;
      const hours = get("hour");
      const minutes = get("minute");
      const seconds = get("second");

      document.getElementById("clock").innerHTML = `${hours}:${minutes}:<span class="seconds">${seconds}</span>`;
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
